[package]
name = "cv-dataset-ir"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Data-oriented computer-vision dataset IR, parallel transforms, and Labelme/COCO/YOLO adapters"
readme = "README.md"

[dependencies]
base64 = "0.23.1"
fast_image_resize = "6.1.0"
geo = "0.33.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "0.27.0", default-features = false }
rayon = "1.12.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
walkdir = "2.5.0"
zstd = "0.14.0"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "throughput"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
members = ["bindings/python"]
default-members = ["."]
resolver = "3"
